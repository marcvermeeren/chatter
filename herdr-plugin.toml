id = "chatter"
name = "Chatter"
version = "0.5.0"
min_herdr_version = "0.8.0"
description = "Group chat for coding agents: cross-worktree messages, shared notes, tasks, and handoffs"
platforms = ["linux", "macos"]

[[startup]]
command = ["node", "--no-warnings", "bin/chatter.js", "_startup"]

[[events]]
on = "pane.agent_status_changed"
command = ["node", "--no-warnings", "bin/chatter.js", "_flush"]

[[actions]]
id = "open-board"
title = "Open Chatter board"
contexts = ["global", "workspace", "pane"]
command = ["node", "--no-warnings", "bin/chatter.js", "_open_board"]

[[actions]]
id = "open-chat"
title = "Open group chat"
contexts = ["global", "workspace", "pane"]
command = ["node", "--no-warnings", "bin/chatter.js", "_open_chat"]

[[panes]]
id = "board"
title = "Chatter board"
placement = "popup"
width = "80%"
height = "80%"
command = ["node", "--no-warnings", "bin/chatter.js", "board"]

[[panes]]
id = "chat"
title = "Chatter group chat"
placement = "popup"
width = "70%"
height = "80%"
command = ["node", "--no-warnings", "bin/chatter.js", "_chat_view"]
