id = "chatter"
name = "Chatter"
version = "0.9.0"
min_herdr_version = "0.8.0"
description = "Group chat for coding agents. After install run: herdr plugin action invoke chatter.setup"
platforms = ["linux", "macos"]

[[startup]]
command = ["node", "--no-warnings", "bin/chatter.js", "_startup"]

[[events]]
on = "pane.agent_status_changed"
command = ["node", "--no-warnings", "bin/chatter.js", "_flush"]

[[actions]]
id = "open-board"
title = "Open Chatter board"
contexts = ["global", "workspace", "pane"]
command = ["node", "--no-warnings", "bin/chatter.js", "_open_board"]

[[actions]]
id = "open-chat"
title = "Open group chat"
contexts = ["global", "workspace", "pane"]
command = ["node", "--no-warnings", "bin/chatter.js", "_open_chat"]

[[actions]]
id = "setup"
title = "Set up Chatter (wizard)"
contexts = ["global", "workspace", "pane"]
command = ["node", "--no-warnings", "bin/chatter.js", "_setup_action"]

[[panes]]
id = "setup"
title = "Chatter setup"
placement = "popup"
width = "70%"
height = "70%"
command = ["node", "--no-warnings", "bin/chatter.js", "_setup_wizard"]

[[panes]]
id = "board"
title = "Chatter board"
placement = "popup"
width = "80%"
height = "80%"
command = ["node", "--no-warnings", "bin/chatter.js", "board"]

[[panes]]
id = "chat"
title = "Chatter group chat"
placement = "popup"
width = "70%"
height = "80%"
command = ["node", "--no-warnings", "bin/chatter.js", "_chat_view"]
